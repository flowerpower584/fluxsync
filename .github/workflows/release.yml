name: release

# Builds the FluxSync desktop app (Tauri) for macOS, Windows and Linux and
# attaches the bundles to a GitHub Release. Triggered by pushing a vX.Y.Z tag.
# The release is published immediately (not a draft) once all 7 artifacts are
# built; a final job then generates SHA256SUMS.txt over all of them and
# uploads it to the same release.
#
# The daemon (`fluxsyncd`) ships inside the app as a Tauri sidecar. It is
# gitignored and staged by `apps/macos-tray/src-tauri/build.rs`, which builds
# fluxsyncd for the active `--target` and writes `binaries/fluxsyncd-<triple>`
# right before the app is compiled — so no manual sidecar step is needed here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Windows (x64)
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - label: Windows (ARM64)
            os: windows-2025
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The Tauri app's lockfile is pnpm; tauri-action drives `pnpm tauri
      # build`, so pnpm must be on PATH before it runs.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/macos-tray/pnpm-lock.yaml

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            build-essential

      # tauri-action skips dependency install when there's no
      # beforeBuildCommand, so the local @tauri-apps/cli is missing and
      # `pnpm tauri build` errors with "tauri: not found". Install it here.
      - name: Install app deps
        working-directory: apps/macos-tray
        run: pnpm install --frozen-lockfile

      - name: Build app + publish to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AppImage bundling fails in linuxdeploy if it strips binaries.
          NO_STRIP: "true"
        with:
          projectPath: apps/macos-tray
          tagName: ${{ github.ref_name }}
          releaseName: FluxSync ${{ github.ref_name }}
          releaseBody: |
            **Universal clipboard — local-first, peer-to-peer, end-to-end encrypted.**
            One Rust daemon, GUI apps for macOS, Windows, Linux and Android, zero servers.

            Download the build for your platform from the assets below.
            **macOS:** grab the `mac-easy-install.zip` for your chip (aarch64 =
            Apple Silicon, x64 = Intel), unzip, and follow README-FIRST.txt — the
            bundled installer handles the Gatekeeper "damaged app" block in one step.
            **Windows:** builds are unsigned — SmartScreen → More info → Run anyway.

            See [CHANGELOG.md](https://github.com/flowerpower584/fluxsync/blob/main/CHANGELOG.md) for the full release notes.
          releaseDraft: false
          prerelease: false
          # No auto-updater wired up — skip the latest.json / .app.tar.gz
          # updater artifacts that otherwise clutter the release.
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

      # macOS builds are not notarized, so the bare .dmg greets users with
      # Gatekeeper's "damaged app" dialog. Ship a zip with a self-serve
      # installer next to the .app that clears quarantine and re-signs ad-hoc.
      - name: Package macOS easy-install zip
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) arch=aarch64 ;;
            *) arch=x64 ;;
          esac
          ver="${GITHUB_REF_NAME#v}"
          app="apps/macos-tray/src-tauri/target/${{ matrix.target }}/release/bundle/macos/FluxSync.app"
          stage="FluxSync-${ver}-mac-${arch}"
          mkdir "$stage"
          ditto "$app" "$stage/FluxSync.app"
          install -m 755 "packaging/macos/Install FluxSync.command" \
            "$stage/Install FluxSync.command"
          cp packaging/macos/README-FIRST.txt "$stage/"
          zip="FluxSync_${ver}_${arch}_mac-easy-install.zip"
          ditto -c -k --keepParent "$stage" "$zip"
          gh release upload "$GITHUB_REF_NAME" "$zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # gradlew's preBuild runs the cargo-ndk cross-compile + UniFFI bindgen.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Restore the release signing key from repo secrets when present.
      # Without the secrets (e.g. a fork or the public origin) this step
      # is a no-op and build.gradle.kts falls back to debug signing, so
      # the APK stays installable either way.
      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_STOREPASS: ${{ secrets.ANDROID_KEYSTORE_STOREPASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEYSTORE_KEYPASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > apps/android/keystore/fluxsync-release.keystore
            {
              echo "storeFile=keystore/fluxsync-release.keystore"
              echo "storePassword=$KS_STOREPASS"
              echo "keyAlias=$KS_ALIAS"
              echo "keyPassword=$KS_KEYPASS"
            } > apps/android/keystore.properties
            echo "Release keystore restored from secrets."
          else
            echo "No keystore secrets found — APK will be debug-signed."
          fi

      - name: Build release APK
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease

      # Fail loudly if the keystore secrets were provided but the APK
      # still ended up debug-signed — a silently debug-signed "release"
      # would break the upgrade path for everyone who installs it.
      - name: Verify APK signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          certs=$("$BT/apksigner" verify --print-certs \
            apps/android/app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          if [ -n "$KS_B64" ] && echo "$certs" | grep -q "Android Debug"; then
            echo "::error::Keystore secrets are set but the APK is debug-signed."
            exit 1
          fi

      - name: Rename APK
        run: |
          set -e
          src=apps/android/app/build/outputs/apk/release/app-release.apk
          cp "$src" "FluxSync-${{ github.ref_name }}-arm64-v8a.apk"
          ls -la FluxSync-*.apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: FluxSync-${{ github.ref_name }}-arm64-v8a.apk

  checksums:
    name: Generate SHA256SUMS
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            release-assets/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --clobber
