name: release

# Builds the FluxSync desktop app (Tauri) for macOS, Windows and Linux and
# attaches the bundles to a GitHub Release. Triggered by pushing a vX.Y.Z tag.
# The release is published immediately (not a draft) once all 7 artifacts are
# built; a final job then generates SHA256SUMS.txt over all of them, uploads
# it to the same release and sets the release notes.
#
# A tag with a pre-release suffix (v0.8.0-beta.1, v1.0.0-rc.2 — anything with
# a "-") is published as a GitHub pre-release: labelled as such on the page,
# and never offered as /releases/latest. Release notes come from
# .github/release-notes/<tag>.md when it exists, else from the tag's section
# of CHANGELOG.md.
#
# The daemon (`fluxsyncd`) ships inside the app as a Tauri sidecar. It is
# gitignored and staged by `apps/macos-tray/src-tauri/build.rs`, which builds
# fluxsyncd for the active `--target` and writes `binaries/fluxsyncd-<triple>`
# right before the app is compiled — so no manual sidecar step is needed here.

on:
  push:
    tags: ["v*"]
  # Release without pushing a tag: run this workflow from the Actions tab
  # on the commit to release; the first job creates the tag there.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.8.0-beta.1 (created on this commit if missing)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  tag:
    name: Tag + version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app version must match the tag, or the bundles would be named
      # after one version and published under another.
      - name: Version matches the tag
        run: |
          set -e
          case "$TAG" in v*) ;; *) echo "::error::Tag must look like v1.2.3 or v1.2.3-beta.1, got '$TAG'."; exit 1 ;; esac
          app=$(jq -r .version apps/macos-tray/src-tauri/tauri.conf.json)
          if [ "v$app" != "$TAG" ]; then
            echo "::error::tauri.conf.json says $app but the tag is $TAG."
            exit 1
          fi

      - name: Create the tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; releasing it as is."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "FluxSync $TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

  desktop:
    name: ${{ matrix.label }}
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Windows (x64)
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - label: Windows (ARM64)
            os: windows-2025
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      # Build what the tag points to, also on a manual re-run of an
      # existing tag from a newer workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The Tauri app's lockfile is pnpm; tauri-action drives `pnpm tauri
      # build`, so pnpm must be on PATH before it runs.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/macos-tray/pnpm-lock.yaml

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            build-essential

      # tauri-action skips dependency install when there's no
      # beforeBuildCommand, so the local @tauri-apps/cli is missing and
      # `pnpm tauri build` errors with "tauri: not found". Install it here.
      - name: Install app deps
        working-directory: apps/macos-tray
        run: pnpm install --frozen-lockfile

      - name: Build app + publish to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AppImage bundling fails in linuxdeploy if it strips binaries.
          NO_STRIP: "true"
        with:
          projectPath: apps/macos-tray
          tagName: ${{ env.TAG }}
          releaseName: FluxSync ${{ env.TAG }}
          releaseBody: |
            **Universal clipboard — local-first, peer-to-peer, end-to-end encrypted.**
            One Rust daemon, GUI apps for macOS, Windows, Linux and Android, zero servers.

            Download the build for your platform from the assets below.
            **macOS:** grab the `.zip` for your chip (aarch64 = Apple Silicon,
            x64 = Intel), unzip, and follow README-FIRST.txt — the bundled
            installer handles the Gatekeeper "damaged app" block in one step.
            **Windows:** builds are unsigned — SmartScreen → More info → Run anyway.

            See [CHANGELOG.md](https://github.com/flowerpower584/fluxsync/blob/main/CHANGELOG.md) for the full release notes.
          releaseDraft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          # No auto-updater wired up — skip the latest.json / .app.tar.gz
          # updater artifacts that otherwise clutter the release.
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

      # macOS builds are not notarized, so the bare .dmg greets users with
      # Gatekeeper's "damaged app" dialog. Replace it with a zip holding the
      # .app plus a self-serve installer that clears quarantine and re-signs
      # ad-hoc; drop the dmg tauri-action uploaded. The bundler deletes its
      # intermediate bundle/macos/FluxSync.app once the dmg is built, so the
      # .app is copied out of the dmg.
      - name: Package macOS zip (replaces dmg)
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) arch=aarch64 ;;
            *) arch=x64 ;;
          esac
          ver="${TAG#v}"
          dmg="apps/macos-tray/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/FluxSync_${ver}_${arch}.dmg"
          stage="FluxSync-${ver}-mac-${arch}"
          mkdir "$stage"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          ditto "$mnt/FluxSync.app" "$stage/FluxSync.app"
          hdiutil detach "$mnt"
          install -m 755 "packaging/macos/Install FluxSync.command" \
            "$stage/Install FluxSync.command"
          cp packaging/macos/README-FIRST.txt "$stage/"
          zip="FluxSync_${ver}_${arch}.zip"
          ditto -c -k --norsrc --keepParent "$stage" "$zip"
          gh release upload "$TAG" "$zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release delete-asset "$TAG" "FluxSync_${ver}_${arch}.dmg" \
            --repo "$GITHUB_REPOSITORY" --yes || true

  android:
    name: Android (arm64-v8a)
    needs: tag
    runs-on: ubuntu-latest
    steps:
      # Build what the tag points to, also on a manual re-run of an
      # existing tag from a newer workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # gradlew's preBuild runs the cargo-ndk cross-compile + UniFFI bindgen.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Restore the release signing key from repo secrets when present.
      # Without the secrets (e.g. a fork or the public origin) this step
      # is a no-op and build.gradle.kts falls back to debug signing, so
      # the APK stays installable either way.
      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_STOREPASS: ${{ secrets.ANDROID_KEYSTORE_STOREPASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEYSTORE_KEYPASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > apps/android/keystore/fluxsync-release.keystore
            {
              echo "storeFile=keystore/fluxsync-release.keystore"
              echo "storePassword=$KS_STOREPASS"
              echo "keyAlias=$KS_ALIAS"
              echo "keyPassword=$KS_KEYPASS"
            } > apps/android/keystore.properties
            echo "Release keystore restored from secrets."
          else
            echo "No keystore secrets found — APK will be debug-signed."
          fi

      - name: Build release APK
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease

      # Fail loudly if the keystore secrets were provided but the APK
      # still ended up debug-signed — a silently debug-signed "release"
      # would break the upgrade path for everyone who installs it.
      - name: Verify APK signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          certs=$("$BT/apksigner" verify --print-certs \
            apps/android/app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          if [ -n "$KS_B64" ] && echo "$certs" | grep -q "Android Debug"; then
            echo "::error::Keystore secrets are set but the APK is debug-signed."
            exit 1
          fi

      - name: Rename APK
        run: |
          set -e
          src=apps/android/app/build/outputs/apk/release/app-release.apk
          cp "$src" "FluxSync-${{ env.TAG }}-arm64-v8a.apk"
          ls -la FluxSync-*.apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          files: FluxSync-${{ env.TAG }}-arm64-v8a.apk

  checksums:
    name: Checksums + release notes
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      # The notes come from what the tag points to.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ env.TAG }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.TAG }}" \
            release-assets/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --clobber

      # The detailed notes: .github/release-notes/<tag>.md if present, else
      # this tag's section of CHANGELOG.md (from its "## [<tag>]" heading to
      # the next "## [" one). Re-asserts the pre-release flag too.
      - name: Set release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
        run: |
          set -e
          notes=".github/release-notes/${TAG}.md"
          if [ ! -f "$notes" ]; then
            notes=release-notes.md
            awk -v tag="$TAG" '
              index($0, "## [" tag "]") == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md > "$notes"
          fi
          if [ ! -s "$notes" ]; then
            echo "::warning::No release notes found for $TAG; keeping the default body."
            exit 0
          fi
          flag=--prerelease=false
          case "$TAG" in *-*) flag=--prerelease ;; esac
          gh release edit "$TAG" --repo "${{ github.repository }}" \
            --notes-file "$notes" "$flag"
