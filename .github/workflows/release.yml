name: release

# Builds the FluxSync desktop app (Tauri) for macOS, Windows and Linux and
# attaches the bundles to a GitHub Release. Triggered by pushing a vX.Y.Z tag.
# The release is published immediately (not a draft) once all 7 artifacts are
# built; a final job then generates SHA256SUMS.txt over all of them and
# uploads it to the same release.
#
# The daemon (`fluxsyncd`) ships inside the app as a Tauri sidecar. It is
# gitignored and staged by `apps/macos-tray/src-tauri/build.rs`, which builds
# fluxsyncd for the active `--target` and writes `binaries/fluxsyncd-<triple>`
# right before the app is compiled — so no manual sidecar step is needed here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Windows (x64)
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - label: Windows (ARM64)
            os: windows-2025
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The Tauri app's lockfile is pnpm; tauri-action drives `pnpm tauri
      # build`, so pnpm must be on PATH before it runs.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/macos-tray/pnpm-lock.yaml

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            build-essential

      # tauri-action skips dependency install when there's no
      # beforeBuildCommand, so the local @tauri-apps/cli is missing and
      # `pnpm tauri build` errors with "tauri: not found". Install it here.
      - name: Install app deps
        working-directory: apps/macos-tray
        run: pnpm install --frozen-lockfile

      - name: Build app + publish to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AppImage bundling fails in linuxdeploy if it strips binaries.
          NO_STRIP: "true"
        with:
          projectPath: apps/macos-tray
          tagName: ${{ github.ref_name }}
          releaseName: FluxSync ${{ github.ref_name }}
          releaseBody: |
            **Universal clipboard — local-first, peer-to-peer, end-to-end encrypted.**
            One Rust daemon, GUI apps for macOS, Windows, Linux and Android, zero servers.

            Download the build for your platform from the assets below. Desktop builds are
            **unsigned** — first launch needs right-click → Open (macOS) or SmartScreen →
            More info → Run anyway (Windows).

            See [CHANGELOG.md](https://github.com/flowerpower584/fluxsync/blob/main/CHANGELOG.md) for the full release notes.
          releaseDraft: false
          prerelease: false
          # No auto-updater wired up — skip the latest.json / .app.tar.gz
          # updater artifacts that otherwise clutter the release.
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # gradlew's preBuild runs the cargo-ndk cross-compile + UniFFI bindgen.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # `release` buildType signs with the debug key (see build.gradle.kts),
      # so the APK is installable without a release keystore secret.
      - name: Build release APK
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          set -e
          src=apps/android/app/build/outputs/apk/release/app-release.apk
          cp "$src" "FluxSync-${{ github.ref_name }}-arm64-v8a.apk"
          ls -la FluxSync-*.apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: FluxSync-${{ github.ref_name }}-arm64-v8a.apk

  checksums:
    name: Generate SHA256SUMS
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            release-assets/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --clobber
