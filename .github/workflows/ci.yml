name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Lint library + binary crates. We surface clippy at warn level
       # for now (visible in the PR diff annotations) instead of denying
       # warnings. Once the open lint debt is cleared we'll flip back to
       # `-D warnings` so any regression breaks CI. Integration tests are
       # excluded — they predate the `Event::sensitive` refactor and are
       # tracked for cleanup separately.
      - run: cargo clippy --workspace --lib --bins --all-features -- -A clippy::pedantic

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # Verify the whole workspace (including the integration test crates)
      # still compiles. We don't run the integration tests in CI yet —
      # 7 known logic regressions need fixing first — but compile failures
      # will block PRs immediately.
      - run: cargo build --workspace --tests --exclude fluxsync-mobile-ffi --exclude uniffi-bindgen
      # Run library unit tests on every OS. Integration tests are tracked
      # for fixup in a follow-up; once green they'll be added here.
      - run: cargo test --workspace --lib --exclude fluxsync-mobile-ffi --exclude uniffi-bindgen

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  msrv:
    name: MSRV (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --exclude fluxsync-mobile-ffi --exclude uniffi-bindgen
