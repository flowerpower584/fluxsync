[workspace]
resolver = "2"
members = [
    "crates/fluxsync-proto",
    "crates/fluxsync-crypto",
    "crates/fluxsync-core",
    "crates/fluxsyncd",
    "crates/fluxctl",
    "crates/fluxsync-mobile-ffi",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Dethie <maxleboss261@gmail.com>"]
repository = "https://github.com/flowerpower584/fluxsync"
description = "Universal clipboard, local-first, peer-to-peer."

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
thiserror = "2.0"
proptest = "1.4"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
# `strip = "debuginfo"` (was "symbols") keeps the static symbols
# UniFFI uses to embed component metadata. With `strip = "symbols"`,
# `cargo run -p uniffi-bindgen -- generate --library lib*.so` finds no
# components and silently produces zero Kotlin files. The Android APK
# is still compact: AGP's own strip pass takes care of symbol removal
# at packaging time, and `lto + codegen-units = 1` already do the
# bulk of the size win.
strip = "debuginfo"

[profile.dev]
opt-level = 0
debug = true
