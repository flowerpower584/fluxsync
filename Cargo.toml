[workspace]
resolver = "2"
members = [
    "crates/fluxsync-proto",
    "crates/fluxsync-crypto",
    "crates/fluxsync-core",
    "crates/fluxsyncd",
    "crates/fluxctl",
    "crates/fluxsync-mobile-ffi",
]

[workspace.package]
version = "0.4.2"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Dethie <maxleboss261@gmail.com>"]
repository = "https://github.com/dethie/fluxsync"
description = "Universal clipboard, local-first, peer-to-peer."

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
thiserror = "1.0"
proptest = "1.4"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
