[package]
name = "fluxsync-mobile-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FluxSync UniFFI bindings for Kotlin / Android."

[lib]
name = "fluxsync_mobile_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"

[dev-dependencies]
tempfile = "3"

[dependencies]
fluxsync-core = { path = "../fluxsync-core" }
fluxsync-crypto = { path = "../fluxsync-crypto" }
fluxsync-proto = { path = "../fluxsync-proto" }
fluxsyncd = { path = "../fluxsyncd" }
uniffi = { version = "0.27" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = "0.7"
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
android_logger = "0.14"
log = "0.4"
