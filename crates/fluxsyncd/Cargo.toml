[package]
name = "fluxsyncd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FluxSync daemon: tokio runtime, UDP transport, IPC, clipboard, battery."

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"

[dependencies]
fluxsync-proto = { path = "../fluxsync-proto" }
dirs = "5"
fluxsync-crypto = { path = "../fluxsync-crypto" }
fluxsync-core = { path = "../fluxsync-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "fs"] }
tokio-util = "0.7"
serde = { workspace = true }
serde_json = "1"
ciborium = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = { workspace = true }
mdns-sd = "0.13"
base32 = "0.5"
hex = "0.4"
sentry = { version = "0.48.1", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["fs", "hostname"] }

# `arboard` only ships backends for desktop OSes (macOS Cocoa, Linux
# X11/Wayland, Windows Win32). On Android the same daemon is linked
# into `fluxsync-mobile-ffi` and the OS clipboard is read/written from
# `MainActivity` via Android's `ClipboardManager`, so the daemon doesn't
# need this dep there. Excluding it keeps `cargo ndk` builds green.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
fluxsync-crypto = { path = "../fluxsync-crypto", features = ["test-util"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "fluxsyncd"
path = "src/main.rs"
