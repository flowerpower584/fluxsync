[package]
name = "fluxsyncd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FluxSync daemon: tokio runtime, UDP transport, IPC, clipboard, battery."

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"

[dependencies]
fluxsync-proto = { path = "../fluxsync-proto" }
fluxsync-crypto = { path = "../fluxsync-crypto" }
fluxsync-core = { path = "../fluxsync-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "fs"] }
serde = { workspace = true }
serde_json = "1"
ciborium = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = { workspace = true }
mdns-sd = "0.13"
base32 = "0.5"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["fs"] }

[dev-dependencies]
fluxsync-crypto = { path = "../fluxsync-crypto", features = ["test-util"] }
tempfile = "3"

[[bin]]
name = "fluxsyncd"
path = "src/main.rs"
