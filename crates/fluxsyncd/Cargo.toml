[package]
name = "fluxsyncd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FluxSync daemon: tokio runtime, UDP transport, IPC, clipboard, battery."

[lints.rust]
# `deny` (not `forbid`) so the Windows IPC module can opt-in via
# `#[allow(unsafe_code)]` to call `CreateNamedPipeW`-style APIs with
# explicit DACLs. Every other module stays `unsafe`-free; the allow
# attribute is reviewed at the call site, not blanket-enabled.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"

[dependencies]
fluxsync-proto = { path = "../fluxsync-proto" }
dirs = "5"
fluxsync-crypto = { path = "../fluxsync-crypto" }
fluxsync-core = { path = "../fluxsync-core" }
# DIR-P1-02: reconnect backoff jitter. Already resolved transitively
# (fluxsync-crypto's `gen_pair_pin` uses the same crate+version for the
# pairing PIN) — this just promotes it to a direct dep so the daemon's
# reconnect path can use the real OS CSPRNG for jitter too.
rand_core = { version = "0.6", features = ["getrandom"] }
# "process" added for DIR-P1-03's chaos harness (tests/chaos_harness.rs),
# which spawns real `fluxsyncd` subprocesses via `tokio::process::Command`.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "fs", "process"] }
tokio-util = "0.7"
serde = { workspace = true }
serde_json = "1"
ciborium = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = { workspace = true }
mdns-sd = "0.19"
base32 = "0.5"
base64 = "0.22"
hex = "0.4"
# PNG codec — pure Rust (`png` feature only), so it builds for Android
# too. Image clipboard sync needs decode/hash on every platform.
image = { version = "0.25", default-features = false, features = ["png"] }
sentry = { version = "0.48.1", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
# FS-053: scrub secret-key buffers on the way to disk / keystore.
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
# "signal" (SIGSTOP/SIGCONT/SIGKILL) and "process" (Pid) added for
# DIR-P1-03's chaos harness (tests/chaos_harness.rs), which drives real
# `fluxsyncd` subprocesses through process-level fault injection.
nix = { version = "0.28", features = ["fs", "hostname", "signal", "process"] }

# macOS-only — `keystore.rs` calls the legacy `SecAccessCreate` /
# `kSecAttrAccess` API directly to attach a self-only ACL to the identity
# keychain item (P1a / DIR-P2-01, opt-in via FLUXSYNC_STRICT_KEYCHAIN=1;
# becomes the default once Developer ID signing lands). Neither `keyring`
# nor the safe
# `security-framework` wrapper expose that call (only the modern
# `kSecAttrAccessControl` / Data Protection Keychain path, which needs a
# `keychain-access-groups` entitlement fluxsyncd doesn't have). Both crates
# are already in the dependency tree transitively via `keyring`'s
# `apple-native` feature; this promotes them to direct deps at the same
# resolved versions.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

# `arboard` only ships backends for desktop OSes (macOS Cocoa, Linux
# X11/Wayland, Windows Win32). On Android the same daemon is linked
# into `fluxsync-mobile-ffi` and the OS clipboard is read/written from
# `MainActivity` via Android's `ClipboardManager`, so the daemon doesn't
# need this dep there. Excluding it keeps `cargo ndk` builds green.
#
# `wayland-data-control` is required for the native Wayland clipboard
# (the `wlr-data-control` protocol, supported by KWin/wlroots). Without
# it arboard falls back to Xwayland, which bridges text but drops
# image/png — so Wayland → peer image sync silently fails. The feature
# is target-gated inside arboard, a no-op on macOS/Windows.
#
# `keyring` ships native backends for macOS Keychain, Windows Credential
# Manager and Linux Secret Service. Android isn't supported by the crate
# (Android Keystore needs JNI, handled separately in fluxsync-mobile-ffi
# or — for now — falls back to the in-app file path on Android).
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
fluxsync-crypto = { path = "../fluxsync-crypto", features = ["test-util"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "fluxsyncd"
path = "src/main.rs"

# Windows-only — used by `ipc.rs` to build an explicit DACL that
# restricts the Named Pipe to the current process owner only (default
# DACL grants Authenticated Users read access). Kept at the very end
# of the manifest: putting a `[target.'cfg(...)']` table above the
# `[[bin]]` block would silently scope `[[bin]]` to that cfg too
# (TOML section headers inherit until the next header).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Power",
] }
