[package]
name = "fluxctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FluxSync CLI — talks to fluxsyncd over the IPC socket."

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "fs"] }
anyhow = "1"
# `default-features = false` drops `image` (PNG/SVG) — we only need the
# unicode terminal renderer, which keeps the dep small.
qrcode = { version = "0.14", default-features = false }
owo-colors = "4"
comfy-table = "7"

[[bin]]
name = "fluxctl"
path = "src/main.rs"
