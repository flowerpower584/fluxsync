# cargo-deny config for the Tauri tray sub-workspace.
#
# Mirrors the root `deny.toml` policy, with extra `ignore` entries for
# the transitive Tauri dep chain (gtk-rs / unic-* / fxhash / proc-macro-error).
# These pin chains live inside Tauri 2.x and cannot be replaced without
# forking Tauri itself, so we accept them as long as the root workspace
# stays clean.
#
# Re-evaluate this file on every Tauri major bump.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # gtk-rs GTK3 bindings — unmaintained but only reached via Tauri's
    # Linux build path. macOS / Windows tray binaries do not link them.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # unic-* family — unmaintained, pinned through urlpattern → tauri-utils.
    "RUSTSEC-2024-0370",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # fxhash unmaintained — pulled in by selectors/cssparser via Tauri.
    "RUSTSEC-2025-0057",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "ISC",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
