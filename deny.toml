# cargo-deny config — runs in CI to enforce dependency hygiene.
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ─────────────────────────────────────────────────────────────────
# Security advisories
# Pulls https://github.com/rustsec/advisory-db/ and fails on known CVEs.
# ─────────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # bincode 1.3.3 — the maintainer publicly stopped development after a
    # harassment incident, but they explicitly stated 1.3.3 is a complete
    # final release that does not need updates. Pulled in transitively;
    # we accept it as-is until a downstream dep migrates.
    "RUSTSEC-2025-0141",
    # paste — proc-macro author archived the crate; widely used,
    # functional, no known vulnerability. Pulled in by uniffi/tokio.
    "RUSTSEC-2024-0436",
]

# ─────────────────────────────────────────────────────────────────
# License compliance
# Allowed licenses for transitive dependencies. Anything else fails CI.
# Keep in sync with our own MIT OR Apache-2.0 dual-license: nothing
# stricter than Apache 2.0 should leak in.
# ─────────────────────────────────────────────────────────────────
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

# ring's license is bespoke (mix of OpenSSL/ISC/MIT). Whitelist the crate
# explicitly so cargo-deny stops flagging it. Same convention as `rustls`
# and most Rust crypto consumers.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c },
]

# ─────────────────────────────────────────────────────────────────
# Banned crates / version constraints
# multiple-versions = "warn" because the Rust ecosystem has duplicates by
# default; we don't fail on it but the warning lets us see when one of
# our deps is dragging in a stale version of a common crate.
# ─────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
# Wildcards downgraded to warn because every crate in this workspace
# uses `path = "../foo"` deps, which cargo-deny records as wildcard
# versions. `allow-wildcard-paths = true` doesn't help here — the
# crates have a `description` and `repository`, so cargo-deny treats
# them as "public" and refuses to apply the wildcard-paths exception
# (since crates.io rejects published crates with path-only deps).
# We're not actually publishing yet, so the public-crate concern
# doesn't apply — surface the warning, don't block CI on it. When we
# do publish, we'll add `version = "0.5.1"` next to each `path = ...`
# and flip this back to "deny".
wildcards = "warn"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ─────────────────────────────────────────────────────────────────
# Source registries
# Reject crates from unknown registries or git deps to closed repos.
# ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
