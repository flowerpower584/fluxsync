# cargo-deny config — runs in CI to enforce dependency hygiene.
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ─────────────────────────────────────────────────────────────────
# Security advisories
# Pulls https://github.com/rustsec/advisory-db/ and fails on known CVEs.
# ─────────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0194 (quadratic-time duplicate-attribute check) and
    # RUSTSEC-2026-0195 (unbounded NsReader namespace-declaration
    # allocation) both require quick-xml >= 0.41.0, which is unreachable
    # here: our only quick-xml consumer is wayland-scanner v0.31.10, a
    # proc-macro / build-time-only crate that pins `quick-xml = "^0.39"`.
    # Chain (`cargo tree -i quick-xml --target all`): quick-xml <-
    # wayland-scanner (proc-macro) <- wayland-client <-
    # wayland-protocols(-wlr) <- wl-clipboard-rs <- arboard <- fluxsyncd
    # (Linux clipboard backend, target-gated to non-Android; the
    # wayland-data-control feature is itself Linux-gated inside arboard).
    # wayland-scanner uses quick-xml only at compile time, to parse the
    # wayland protocol's own vendored XML spec files into Rust bindings —
    # it never ships in the built binary and never parses
    # attacker-controlled or network-sourced XML, so both DoS vectors
    # (crafted XML with pathological attribute/namespace counts) are not
    # reachable in FluxSync. Revisit: re-run `cargo update -p quick-xml`
    # periodically and drop this ignore once wayland-scanner requires
    # quick-xml >= 0.41.0.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

# ─────────────────────────────────────────────────────────────────
# License compliance
# Allowed licenses for transitive dependencies. Anything else fails CI.
# Keep in sync with our own MIT OR Apache-2.0 dual-license: nothing
# stricter than Apache 2.0 should leak in.
# ─────────────────────────────────────────────────────────────────
[licenses]
# Trimmed to licenses actually encountered in the dep tree. If a future
# transitive dep brings a new license, CI will fail and we'll add it here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "ISC",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

# ─────────────────────────────────────────────────────────────────
# Banned crates / version constraints
# multiple-versions = "warn" because the Rust ecosystem has duplicates by
# default; we don't fail on it but the warning lets us see when one of
# our deps is dragging in a stale version of a common crate.
# ─────────────────────────────────────────────────────────────────
[bans]
# Duplicates are inherent in the Rust ecosystem (windows-sys, thiserror,
# socket2, etc. routinely ship multiple major versions through transitive
# deps). Allow them — we'd never finish chasing the long tail.
multiple-versions = "allow"
# Internal workspace crates use `path = "../foo"` which cargo-deny logs
# as wildcard. We're not publishing to crates.io yet, so allow them.
# When we publish, set this to "deny" and add `version = "0.5.1"` next
# to each `path = ...` entry.
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ─────────────────────────────────────────────────────────────────
# Source registries
# Reject crates from unknown registries or git deps to closed repos.
# ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
